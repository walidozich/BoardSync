services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    restart: unless-stopped
    working_dir: /src/BoardSync.Api
    command: >
      sh -c "dotnet watch run --urls http://0.0.0.0:8080 --non-interactive"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      CorsOrigin: ${CorsOrigin}
    ports:
      - '${API_PORT:-5080}:8080'
    volumes:
      - ./server:/src
      - api-nuget-cache:/root/.nuget/packages
      - api-bin:/src/BoardSync.Api/bin
      - api-obj:/src/BoardSync.Api/obj
      - tests-bin:/src/BoardSync.Tests/bin
      - tests-obj:/src/BoardSync.Tests/obj
    depends_on:
      db:
        condition: service_healthy

  client:
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "corepack enable && pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      CI: 'true'
    ports:
      - '${CLIENT_PORT:-5173}:5173'
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
      - client-pnpm-store:/pnpm-store
    depends_on:
      - api

volumes:
  db-data:
  api-nuget-cache:
  api-bin:
  api-obj:
  tests-bin:
  tests-obj:
  client-node-modules:
  client-pnpm-store:
